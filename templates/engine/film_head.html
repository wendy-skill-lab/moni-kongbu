<script>
(()=>{

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)), lerp=(a,b,p)=>a+(b-a)*p;
const prog=(t,s,e)=>clamp((t-s)/(e-s),0,1);
const eio=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2, eo=p=>1-Math.pow(1-p,3);
const sio=p=>p*p*(3-2*p);
const root=document.getElementById('screen');
const pad=n=>String(n).padStart(2,'0');
function clockSec(t){let c=F.clocks[0];for(const x of F.clocks)if(t>=x[0])c=x;return c[1]*3600+c[2]*60+c[3]+Math.floor(t-c[0]);}
function clock(t){const b=clockSec(t);return pad(Math.floor(b/3600)%24)+':'+pad(Math.floor(b/60)%60);}
function clockFull(t){const b=clockSec(t);return pad(Math.floor(b/3600)%24)+':'+pad(Math.floor(b/60)%60)+':'+pad(b%60);}
function dateLabel(t){let d=F.dates[0][1];for(const x of F.dates)if(t>=x[0])d=x[1];return d;}
const hash=n=>{let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);};
// ---------- system chrome ----------
function battLevel(){const t=window.__BT||0,L=F.sfx.locks;return t<L[0]?59:t<L[1]?58:t<L[2]?57:t<L[3]?56:55;}
function battery(c){const B=battLevel();return `<svg width="29" height="13" viewBox="0 0 29 13"><rect x=".5" y=".5" width="25" height="12" rx="3.8" fill="${c}" fill-opacity=".35"/><rect x=".5" y=".5" width="${25*B/100}" height="12" rx="3.8" fill="${c}"/><text x="12.8" y="10.2" text-anchor="middle" font-family="InterV" font-weight="700" font-size="10.5" fill="${/^#0|^#1|black/i.test(c)?'#fff':'#000'}">${B}</text><path d="M26.8 4.4v4.2c.9-.3 1.5-1.1 1.5-2.1s-.6-1.8-1.5-2.1z" fill="${c}" fill-opacity=".4"/></svg>`;}
function statusRight(c){return `<div class="a" style="right:21px;top:20px;display:flex;align-items:center;gap:5px;height:16px">
<svg width="18" height="13" viewBox="0 0 18 13"><path d="M9 2.2c2.7 0 5.1 1 7 2.7l1.3-1.4C15 1.4 12.1.2 9 .2S3 1.4.7 3.5L2 4.9c1.9-1.7 4.3-2.7 7-2.7z" fill="${c}"/><path d="M9 5.9c1.7 0 3.2.6 4.4 1.7l1.3-1.4C13.2 4.8 11.2 4 9 4s-4.2.8-5.7 2.2l1.3 1.4C5.8 6.5 7.3 5.9 9 5.9z" fill="${c}"/><path d="M9 9.6c.7 0 1.3.3 1.8.7L9 12.2l-1.8-1.9c.5-.4 1.1-.7 1.8-.7z" fill="${c}"/></svg>${battery(c)}</div>`;}
function statusBar(t,mode){window.__BT=t;
 const c=mode==='dark'?'#111':'#fff';
 if(mode==='none')return '';
 const left=mode==='lock'?`<div class="a cjk" style="left:30px;top:15px;font:500 15px 'Noto Sans CJK SC';color:${c}">中国移动</div>`:`<div class="a" style="left:0;width:132px;top:14px;text-align:center;font:620 17px InterV;color:${c};letter-spacing:-.2px">${clock(t)}</div>`;
 return left+statusRight(c);
}
function callBadge(t){return t>=F.call.connect&&t<F.call.end&&!inCallScreen(t);}
function inCallScreen(t){const s=F.segments.find(x=>t>=x.s&&t<x.e);return s&&(s.type==='callIn'||s.type==='call');}
function island(t){
 let w=126,h=37,inner='';let g=0,open=0;
 for(const [s,e] of F.faceid){const v=prog(t,s,s+0.28)*(1-prog(t,e-0.2,e));if(v>g){g=v;open=prog(t,s+0.32,s+0.5);}}
 if(g>0){w=lerp(126,138,eo(g));h=lerp(37,53,eo(g));
  inner=`<svg class="a" style="left:${w/2-8}px;top:${h-27}px;opacity:${eo(g)}" width="16" height="21" viewBox="0 0 22 28"><rect x="2" y="12" width="18" height="14" rx="3.5" fill="#fff"/><path d="M6 12 V8 a5 5 0 0 1 10 0 V${lerp(12,6,open)}" fill="none" stroke="#fff" stroke-width="2.6" transform="translate(${lerp(0,6,open)} ${lerp(0,-3,open)})"/></svg>`;}
 const cb=callBadge(t);
 if(cb&&g===0){w=150;inner=`<div class="a" style="left:12px;top:9.5px">${G.handset('#30d158',0,18)}</div><div class="a" style="right:14px;top:14.5px;width:8px;height:8px;border-radius:4px;background:#30d158"></div>`;}
 return `<div class="a" style="left:${(W-w)/2}px;top:11px;width:${w}px;height:${h}px;border-radius:${Math.min(h/2,26)}px;background:#000;z-index:50">${inner}<div class="a" style="left:13px;top:14.5px;width:8px;height:8px;border-radius:4px;background:#ff3b30;opacity:${g>0.3||cb?0:1}"></div></div>`;
}
const homeBar=(c='#fff')=>`<div class="a" style="left:${(W-134)/2}px;bottom:8px;width:134px;height:5px;border-radius:3px;background:${c};z-index:40"></div>`;
// ---------- glyphs ----------
const G={

 more:`<svg width="22" height="6" viewBox="0 0 22 6"><circle cx="3" cy="3" r="2.2" fill="#e6e6e6"/><circle cx="11" cy="3" r="2.2" fill="#e6e6e6"/><circle cx="19" cy="3" r="2.2" fill="#e6e6e6"/></svg>`,

 voice:`<svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="13.6" fill="none" stroke="#d2d2d2" stroke-width="1.5"/><path d="M11 12.2a4 4 0 0 1 0 5.6M14.2 9.6a7.6 7.6 0 0 1 0 10.8" fill="none" stroke="#d2d2d2" stroke-width="1.6" stroke-linecap="round"/><circle cx="8.6" cy="15" r="1.1" fill="#d2d2d2"/></svg>`,
 emoji:`<svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="13.6" fill="none" stroke="#d2d2d2" stroke-width="1.5"/><circle cx="10.6" cy="12.4" r="1.4" fill="#d2d2d2"/><circle cx="19.4" cy="12.4" r="1.4" fill="#d2d2d2"/><path d="M9.6 17.6c2.8 3.6 8 3.6 10.8 0" fill="none" stroke="#d2d2d2" stroke-width="1.6" stroke-linecap="round"/></svg>`,
 plus:`<svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="13.6" fill="none" stroke="#d2d2d2" stroke-width="1.5"/><path d="M15 8.5v13M8.5 15h13" stroke="#d2d2d2" stroke-width="1.6" stroke-linecap="round"/></svg>`,
 photo:`<svg width="30" height="26" viewBox="0 0 30 26"><rect x="2" y="2" width="26" height="22" rx="2.5" fill="none" stroke="#cfcfcf" stroke-width="2"/><path d="M4 21l7-8 5 5 4-4 6 7" fill="none" stroke="#cfcfcf" stroke-width="2" stroke-linejoin="round"/><circle cx="20" cy="8.5" r="2.4" fill="#cfcfcf"/></svg>`,
 cam:`<svg width="30" height="26" viewBox="0 0 30 26"><path d="M3 7h6l2.4-3.4h7.2L21 7h6v16H3z" fill="#cfcfcf"/><circle cx="15" cy="15" r="5" fill="#2c2c2c"/><circle cx="15" cy="15" r="3.4" fill="#cfcfcf"/></svg>`,
 video:`<svg width="32" height="24" viewBox="0 0 32 24"><rect x="2" y="4" width="20" height="16" rx="3" fill="#cfcfcf"/><path d="M23.5 10 30 5.5v13L23.5 14z" fill="#cfcfcf"/></svg>`,
 pin:`<svg width="26" height="30" viewBox="0 0 26 30"><path d="M13 2C7.5 2 3.5 6 3.5 11.2 3.5 18 13 28 13 28s9.5-10 9.5-16.8C22.5 6 18.5 2 13 2z" fill="#cfcfcf"/><circle cx="13" cy="11" r="3.6" fill="#2c2c2c"/></svg>`,
 hongbao:`<svg width="24" height="30" viewBox="0 0 24 30"><rect x="2" y="2" width="20" height="26" rx="2.5" fill="#cfcfcf"/><path d="M2 8c5 4 15 4 20 0" stroke="#2c2c2c" stroke-width="1.8" fill="none"/><circle cx="12" cy="12" r="3" fill="#2c2c2c"/></svg>`,
 mic:(c='#cfcfcf')=>`<svg width="24" height="30" viewBox="0 0 24 30"><rect x="7" y="2" width="10" height="17" rx="5" fill="${c}"/><path d="M3.5 14a8.5 8.5 0 0 0 17 0M12 22.5V28" stroke="${c}" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`,
 fav:`<svg width="28" height="28" viewBox="0 0 28 28"><path d="M14 2 25 8v12L14 26 3 20V8z" fill="#cfcfcf"/><path d="M3 8l11 6 11-6M14 14v12" stroke="#2c2c2c" stroke-width="1.6" fill="none"/></svg>`,
 transfer:`<svg width="28" height="28" viewBox="0 0 28 28"><path d="M4 9h18l-4-4M24 19H6l4 4" stroke="#cfcfcf" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
 handset:(c='#fff',r=135,s=30)=>`<svg width="${s}" height="${s}" viewBox="0 0 30 30" style="transform:rotate(${r}deg);display:block"><path d="M8.2 4.5c1.4-.6 2.4.2 3 1.4l1.6 3.4c.5 1-.1 2-.9 2.6l-1.4 1c.9 2.4 3.4 5 5.8 6l1.1-1.4c.6-.8 1.6-1.3 2.6-.8l3.4 1.7c1.2.6 1.9 1.7 1.3 3-.9 2.2-3.4 3.4-5.6 2.8C11.8 22.7 7.2 18 5.7 10.8c-.5-2.4.4-5.4 2.5-6.3z" fill="${c}"/></svg>`,
 shrink:`<svg width="22" height="22" viewBox="0 0 22 22"><path d="M12.5 9.5 20 2M12.5 9.5V4.5M12.5 9.5h5M9.5 12.5 2 20M9.5 12.5v5M9.5 12.5h-5" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>`,
 spk:(c='#111',on=true)=>`<svg width="24" height="22" viewBox="0 0 24 22"><path d="M2 7.5h4.5L12 3v16l-5.5-4.5H2z" fill="${c}"/>${on?`<path d="M15.5 7a5 5 0 0 1 0 8M18.5 4.5a9 9 0 0 1 0 13" stroke="${c}" stroke-width="2" fill="none" stroke-linecap="round"/>`:`<path d="M15.5 7.5l6 6M21.5 7.5l-6 6" stroke="${c}" stroke-width="2" stroke-linecap="round"/>`}</svg>`,
};
// The baby-monitor app icon (fictional brand “小芽看护”).
function xyIcon(s=38,r=9){return `<svg width="${s}" height="${s}" viewBox="0 0 60 60" style="display:block;border-radius:${r}px"><defs><linearGradient id="xg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#63dcc0"/><stop offset="1" stop-color="#14a088"/></linearGradient></defs><rect width="60" height="60" fill="url(#xg)"/><circle cx="30" cy="34" r="14.5" fill="#fff"/><circle cx="30" cy="34" r="7.4" fill="#14a088"/><circle cx="30" cy="34" r="3.2" fill="#0b4a3f"/><path d="M30 19.5C29.4 13.6 33 9.6 40.6 9.4 40.8 16.4 36.6 19.6 30 19.5Z" fill="#fff"/><path d="M30 19.5C29 15.6 25.6 13.4 20.6 13.8 21 18.4 24.6 20.2 30 19.5Z" fill="#e8fff8"/></svg>`;}
// ---------- typing ----------
const KEYS=['qwertyuiop','asdfghjkl','zxcvbnm'];
function keyRect(ch){for(let r=0;r<3;r++){const i=KEYS[r].indexOf(ch);if(i>=0){const kw=33.3,gap=6;let x0=r===0?3:r===1?3+19.65:61.95;return {x:x0+i*(kw+gap),y:52+r*54,w:kw};}}return null;}
function draftState(d,t){
 let cur=d.start,events=[];
 for(const [py,txt] of d.chunks){
  if(py){const letters=py.replace(/ /g,'');for(let i=0;i<letters.length;i++){events.push({t:cur,type:'k',ch:letters[i]});cur+=0.105;}cur+=0.12;events.push({t:cur,type:'c',txt,py});cur+=0.2;}
  else{cur+=0.2;events.push({t:cur,type:'c',txt,py});cur+=0.14;}
 }
 const avail=(d.send-0.25)-d.start,need=cur-d.start,f=Math.min(1,avail/need);
 events.forEach(e=>e.t=d.start+(e.t-d.start)*f);
 let committed='',chunkIdx=0,typedInChunk=0,pressed=null;
 const syl=d.chunks.map(c=>c[0]?c[0].split(' '):[]);
 for(const e of events){if(e.t>t)break;if(e.type==='k'){typedInChunk++;if(t-e.t<0.09)pressed=e.ch;}else{committed+=e.txt;chunkIdx++;typedInChunk=0;}}
 let marked='';
 if(chunkIdx<d.chunks.length&&typedInChunk>0){let n=typedInChunk;const s=syl[chunkIdx];const parts=[];for(const x of s){if(n<=0)break;parts.push(x.slice(0,n));n-=x.length;}marked=parts.join("'");}
 const target=chunkIdx<d.chunks.length?d.chunks[chunkIdx][1]:'';
 const cands=marked?(F.decoys[target]||[target]):null;
 return {committed,marked,cands,pressed,sendPress:t>d.send-0.1&&t<d.send};
}
function activeDraft(chat,t){return F.drafts.find(d=>d.chat===chat&&t>=d.start-0.4&&t<d.send);}
function winP(list,chat,t,dur=0.26){let p=0;for(const w of list){if(w.chat!==chat)continue;if(t>=w.s&&t<w.e+dur){p=Math.max(p,Math.min(eo(prog(t,w.s,w.s+dur)),1-eo(prog(t,w.e,w.e+dur))));}}return p;}
function keyboard(st,t){
 const ds=st||{};let cand;
 if(ds.cands){cand=`<div class="a cjk" style="left:14px;top:9px;display:flex;gap:22px;font:400 18px 'Noto Sans CJK SC';color:#e8e8e8">${ds.cands.map((c,i)=>`<span style="${i===0?'color:#fff':''}">${c}</span>`).join('')}</div><svg class="a" style="right:14px;top:16px" width="16" height="10" viewBox="0 0 16 10"><path d="M2 2l6 6 6-6" stroke="#cfcfcf" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>`;}
 else cand=`<div class="a cjk" style="left:20px;top:11px;display:flex;gap:29px;font:400 16px 'Noto Sans CJK SC';color:#cfcfcf">${F.idleCandidates.map(c=>`<span>${c}</span>`).join('')}</div>`;
 let keys='';
 KEYS.forEach((row,r)=>{for(const ch of row){const k=keyRect(ch);keys+=`<div class="key" style="left:${k.x}px;top:${k.y}px;width:${k.w}px;${ds.pressed===ch?'background:#8d8c90':''}">${ch}</div>`;}});
 keys+=`<div class="key fk" style="left:3px;top:160px;width:43px"><svg width="20" height="19" viewBox="0 0 20 19"><path d="M10 2 2 10h4.4v7h7.2v-7H18z" fill="none" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/></svg></div>`;
 keys+=`<div class="key fk" style="left:347px;top:160px;width:43px"><svg width="24" height="17" viewBox="0 0 24 17"><path d="M7.5 1.5h14a1.5 1.5 0 0 1 1.5 1.5v11a1.5 1.5 0 0 1-1.5 1.5h-14L1.5 8.5z" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="M11 5.2l6.4 6.6M17.4 5.2 11 11.8" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg></div>`;
 keys+=`<div class="key fk" style="left:3px;top:214px;width:43px;font:400 16px InterV">123</div><div class="key fk" style="left:51px;top:214px;width:43px"><svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="9.4" fill="none" stroke="#fff" stroke-width="1.5"/><circle cx="7.8" cy="8.8" r="1.2" fill="#fff"/><circle cx="14.2" cy="8.8" r="1.2" fill="#fff"/><path d="M6.8 13c2.2 3 6.2 3 8.4 0" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></div><div class="key kl" style="left:99px;top:214px;width:164px">空格</div><div class="key fk kl" style="left:268px;top:214px;width:43px">中</div><div class="key fk kl" style="left:316px;top:214px;width:74px;${ds.sendPress?'background:#6b6a6d':''}">发送</div>`;
 let pop='';
 if(ds.pressed){const k=keyRect(ds.pressed);const pw=k.w+20,ph=60;pop=`<div class="a" style="left:${k.x-10}px;top:${k.y-ph+6}px;width:${pw}px;height:${ph}px;border-radius:9px;background:#8d8c90;display:flex;align-items:flex-start;justify-content:center;padding-top:4px;font:400 33px InterV;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4);z-index:5">${ds.pressed}</div>`;}
 return `<div class="a" style="left:0;top:0;width:393px;height:${KBH}px;background:#2b2a2d">${cand}${keys}${pop}</div>`;
}
const P=F.people;const avOf=w=>TH+P[w][1]+'.jpg';const nameOf=w=>P[w][0];
// ---------- WeChat chat ----------
function wave(c,phase){const n=phase==null?3:phase;return `<svg width="16" height="20" viewBox="0 0 16 20" style="flex:0 0 16px"><path d="M3 8.6a2 2 0 0 1 0 2.8" stroke="${c}" stroke-width="2" fill="none" stroke-linecap="round"/>${n>=2?`<path d="M6.5 5.4a6.4 6.4 0 0 1 0 9.2" stroke="${c}" stroke-width="2" fill="none" stroke-linecap="round"/>`:''}${n>=3?`<path d="M10.2 2.2a11 11 0 0 1 0 15.6" stroke="${c}" stroke-width="2" fill="none" stroke-linecap="round"/>`:''}</svg>`;}
function msgRow(m,t,chat){
 if(m.kind==='time')return `<div class="ts">${m.label||clock(m.t)}</div>`;
 const me=m.who==='me',age=t-m.t;let anim='';
 if(age>=0&&age<0.24){const q=eo(age/0.24);anim=`opacity:${Math.min(1,q*1.6)};transform:translateY(${(1-q)*10}px)`;}
 let body;
 if(m.kind==='image'){const tap=F.segments.some(s=>s.type==='imgOpen'&&t>=s.s-0.14&&t<s.s);body=`<img id="im-${m.mid}" src="${TH}${m.src}.jpg" style="display:block;width:${m.w}px;height:${m.h}px;object-fit:cover;border-radius:5px;${tap?'filter:brightness(.7)':''}">`;}
 else if(m.kind==='voice'){const pl=m.play;const played=t>=pl[0];const playing=t>=pl[0]&&t<pl[1];const press=t>=pl[0]-0.12&&t<pl[0]+0.08;
